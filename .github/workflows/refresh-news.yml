# If the site is hosted on GitHub Pages, this refreshes the headlines every Monday morning.
name: Refresh news headlines
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/refresh_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add js/news-feed.js
          git diff --cached --quiet || git commit -m "Refresh news headlines"
          git push
